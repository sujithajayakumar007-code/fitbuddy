<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        FitBuddy
        {% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
    >
</head>

<body>

<header class="navbar">

    <div class="container nav-content">

        <a href="/" class="brand">
            <span class="brand-icon">🏋️</span>
            FitBuddy
        </a>

        <nav>

            <a href="/">
                Create Plan
            </a>

            <a href="/view-all-users">
                Admin
            </a>

            <a href="/docs">
                API Docs
            </a>

        </nav>

    </div>

</header>


<main class="container main-content">

    {% block content %}
    {% endblock %}

</main>


<footer class="footer">

    <div class="container">

        <p>
            FitBuddy — AI Fitness Plan Generator
        </p>

        <p class="small-text">
            General wellness information only. Not medical advice.
        </p>

    </div>

</footer>

</body>

</html>
